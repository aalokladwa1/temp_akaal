apiVersion: v2
name: akaal-worker-fabric
description: >
  P7B.20 -- Helm chart for the AKAAL elastic worker fabric (P7B.22) execution capacity
  at a Kubernetes-kind akaalEngine.fabric.execution_site.ExecutionSite. This chart
  deploys WORKER infrastructure only -- it has no notion of Migration/ExecutionPlan
  truth, which remains the canonical akaalEngine runtime's responsibility, reached by the
  worker image at container startup, never by anything in this chart.
