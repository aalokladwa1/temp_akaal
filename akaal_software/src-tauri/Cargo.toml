[package]
name = "akaal_software"
version = "0.1.0"
description = "AKAAL Enterprise Migration Platform Desktop App"
authors = ["AKAAL Integration Team"]
edition = "2021"

[lib]
name = "akaal_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-opener = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 0
debug = 0
incremental = false
codegen-units = 16

[profile.dev.package.windows]
opt-level = 1

[profile.dev.package.windows-sys]
opt-level = 1
