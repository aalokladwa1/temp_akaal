[package]
name = "akaal_software"
version = "0.1.0"
description = "AKAAL Enterprise Migration Platform Desktop App"
authors = ["AKAAL Integration Team"]
edition = "2021"

[lib]
name = "akaal_software_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry", "custom-protocol"] }
tauri-plugin-opener = "2"
serde = { version = "1.0.217", features = ["derive", "std"] }
serde_json = { version = "1", features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
chrono = { version = "0.4", features = ["serde", "std", "clock"] }

[features]
default = ["custom-protocol"]
custom-protocol = []

[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"
codegen-units = 1
incremental = false

[profile.dev.build-override]
opt-level = 0
codegen-units = 1

[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.dev.package.windows]
opt-level = "s"
codegen-units = 1
debug = 0

[profile.dev.package.windows-sys]
opt-level = "s"
codegen-units = 1
debug = 0

[profile.dev.package.tauri]
opt-level = "s"
codegen-units = 1
debug = 0

[profile.dev.package.tauri-utils]
opt-level = "s"
codegen-units = 1
debug = 0



